<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodboard Generator 2.0</title>
  <link rel="stylesheet" href="styles/main.css">

  <!-- font-awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- tipografía -->
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Swiper CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
</head>


<body>
  <div class="container">


    <div class="container__top">

      <div class="step-indicator">
        <div class="step-indicator__title text-small">Paso 1 de 5</div>
        <div class="step-indicator__bars">
          <div class="step-indicator__bar step-indicator__bar--active"></div>
          <div class="step-indicator__bar"></div>
          <div class="step-indicator__bar"></div>
          <div class="step-indicator__bar"></div> 
        </div>
        <div class="step-indicator__back">
          <i class="fa-solid fa-arrow-left step-counter__back-arrow"></i>
          <p class="text-small">Atras</p>
        </div>
      </div>

      <div class="texts">
        <h2>Colores Fresh</h2>
        <p class="text-base">Elige la atmósfera a través del color.</p>
      </div>
    </div>


    <div class="container__middle">

      <div class="container__middle-square">

        <div class="swiper mySwiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide"></div>
            <div class="swiper-slide"></div>
            <div class="swiper-slide"></div>
            <div class="swiper-slide"></div>
            <div class="swiper-slide"></div>
            <div class="swiper-slide"></div>
            <div class="swiper-slide"></div>
            <div class="swiper-slide"></div>
            <div class="swiper-slide"></div>
          </div>
        </div>    
           
      </div>    
      <div class="swiper-pagination"></div> 
    </div>  




    <div class="container__bottom">
      <p class="text-tiny">Design by Rafcelot version 2.0</p>
    </div>


  </div>


    <!-- Swiper JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="scripts.js"></script>


</body>
</html>
